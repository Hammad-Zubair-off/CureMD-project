apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: healthcare
type: Opaque
stringData:
  # Shared across all services
  jwt-secret: "your_shared_jwt_secret_here"
  internal-secret: "your_internal_secret_here"

  # MongoDB Atlas URIs (one per service)
  mongo-auth-uri: "mongodb+srv://user:pass@cluster.mongodb.net/auth-db"
  mongo-patient-uri: "mongodb+srv://user:pass@cluster.mongodb.net/patient-db"
  mongo-doctor-uri: "mongodb+srv://user:pass@cluster.mongodb.net/doctor-db"
  mongo-appointment-uri: "mongodb+srv://user:pass@cluster.mongodb.net/appointment-db"
  mongo-payment-uri: "mongodb+srv://user:pass@cluster.mongodb.net/payment-db"
  mongo-notification-uri: "mongodb+srv://user:pass@cluster.mongodb.net/notification-db"
  mongo-telemedicine-uri: "mongodb+srv://user:pass@cluster.mongodb.net/telemedicine-db"
  mongo-ai-uri: "mongodb+srv://user:pass@cluster.mongodb.net/ai-db"

  # Payment
  stripe-secret-key: "sk_test_your_key"
  stripe-webhook-secret: "whsec_your_secret"
  stripe-public-key: "pk_test_your_key"

  # Notifications
  brevo-api-key: "xkeysib-your_key"
  twilio-account-sid: "ACxxxxxxxx"
  twilio-auth-token: "your_auth_token"
  twilio-phone-number: "+1xxxxxxxxxx"

  # Media
  cloudinary-cloud-name: "your_cloud_name"
  cloudinary-api-key: "your_api_key"
  cloudinary-api-secret: "your_api_secret"

  # Video
  agora-app-id: "your_agora_app_id"
  agora-app-certificate: "your_agora_certificate"

  # AI
  gemini-api-key-1: "your_gemini_key_1"
  gemini-api-key-2: "your_gemini_key_2"
  gemini-api-key-3: "your_gemini_key_3"
  gemini-api-key-4: "your_gemini_key_4"

  # RabbitMQ
