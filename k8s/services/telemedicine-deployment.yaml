apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemedicine-service
  namespace: healthcare
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telemedicine-service
  template:
    metadata:
      labels:
        app: telemedicine-service
    spec:
      containers:
      - name: telemedicine-service
        image: telemedicine-service:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3007
        env:
        - name: PORT
          value: "3007"
        - name: SERVICE_NAME
          value: "telemedicine"
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: mongo-telemedicine-uri
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: jwt-secret
        - name: APPOINTMENT_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: service-config
              key: APPOINTMENT_SERVICE_URL
        - name: AGORA_APP_ID
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: agora-app-id
        - name: AGORA_APP_CERTIFICATE
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: agora-app-certificate
        - name: FRONTEND_URL
          valueFrom:
            configMapKeyRef:
              name: service-config
              key: FRONTEND_URL
        - name: ALLOWED_ORIGINS
          valueFrom:
            configMapKeyRef:
              name: service-config
              key: ALLOWED_ORIGINS
        readinessProbe:
          httpGet:
            path: /health
            port: 3007
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 3007
          initialDelaySeconds: 30
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: telemedicine-service
  namespace: healthcare
spec:
  selector:
    app: telemedicine-service
  ports:
  - port: 3007
    targetPort: 3007