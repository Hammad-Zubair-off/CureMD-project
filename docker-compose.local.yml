# Local development overlay: MongoDB in Docker (alternative to MongoDB Atlas).
# Usage: docker compose -f docker-compose.yml -f docker-compose.local.yml --profile <profile> up

services:
  nginx:
    volumes:
      - ./api-gateway/nginx.local.conf:/etc/nginx/nginx.conf:ro

  mongo:
    image: mongo:7-jammy
    container_name: healthcare-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - healthcare-net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    profiles:
      - full
      - frontend
      - auth
      - patient
      - doctor
      - appointment
      - payment
      - notification
      - telemedicine
      - ai-symptom

volumes:
  mongo_data:
