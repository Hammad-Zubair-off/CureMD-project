events {
    worker_connections 1024;
}

http {
    # Render's free tier has no private networking between services, so the
    # gateway reaches each backend service via its public onrender.com URL,
    # the same way any external client would.
    resolver 8.8.8.8 8.8.4.4 valid=30s ipv6=off;

    server {
        listen 80;
        client_max_body_size 10M;

        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         "upgrade";
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header Authorization      $http_authorization;
        proxy_cache_bypass                  $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        location /api/auth {
            set $upstream curemd-auth-service.onrender.com;
            proxy_set_header Host $upstream;
            proxy_pass https://$upstream;
        }

        location /api/patients {
            set $upstream curemd-patient-service.onrender.com;
            proxy_set_header Host $upstream;
            proxy_pass https://$upstream;
        }

        location /api/doctors {
            set $upstream curemd-doctor-service.onrender.com;
            proxy_set_header Host $upstream;
            proxy_pass https://$upstream;
        }

        location /api/appointments {
            set $upstream curemd-appointment-service.onrender.com;
            proxy_set_header Host $upstream;
            proxy_pass https://$upstream;
        }

        location /api/payments {
            set $upstream curemd-payment-service.onrender.com;
            proxy_set_header Host $upstream;
            proxy_pass https://$upstream;
        }

        location /api/notifications {
            set $upstream curemd-notification-service.onrender.com;
            proxy_set_header Host $upstream;
            proxy_pass https://$upstream;
        }

        location /api/telemedicine {
            set $upstream curemd-telemedicine-service.onrender.com;
            proxy_set_header Host $upstream;
            proxy_pass https://$upstream;
        }

        location /api/ai {
            set $upstream curemd-ai-symptom-service.onrender.com;
            proxy_set_header Host $upstream;
            proxy_pass https://$upstream;
        }

        location /health {
            return 200 '{"status":"ok","service":"api-gateway"}';
            add_header Content-Type application/json;
        }
    }
}
