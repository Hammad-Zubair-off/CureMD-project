events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        client_max_body_size 10M;

        proxy_http_version 1.1;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         "upgrade";
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header Authorization      $http_authorization;
        proxy_cache_bypass                  $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        location /api/auth {
            proxy_pass http://curemd-auth-service:3001;
        }

        location /api/patients {
            proxy_pass http://curemd-patient-service:3002;
        }

        location /api/doctors {
            proxy_pass http://curemd-doctor-service:3003;
        }

        location /api/appointments {
            proxy_pass http://curemd-appointment-service:3004;
        }

        location /api/payments {
            proxy_pass http://curemd-payment-service:3005;
        }

        location /api/notifications {
            proxy_pass http://curemd-notification-service:3006;
        }

        location /api/telemedicine {
            proxy_pass http://curemd-telemedicine-service:3007;
        }

        location /api/ai {
            proxy_pass http://curemd-ai-symptom-service:3008;
        }

        location /health {
            return 200 '{"status":"ok","service":"api-gateway"}';
            add_header Content-Type application/json;
        }
    }
}
