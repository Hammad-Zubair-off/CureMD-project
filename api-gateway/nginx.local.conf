events {
    worker_connections 1024;
}

http {
    # Docker embedded DNS — allows nginx to start before all upstreams exist
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        client_max_body_size 10M;

        proxy_http_version 1.1;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         "upgrade";
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header Authorization      $http_authorization;
        proxy_cache_bypass                  $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        location /api/auth {
            set $upstream_auth auth-service:3001;
            proxy_pass http://$upstream_auth;
        }

        location /api/patients {
            set $upstream_patient patient-service:3002;
            proxy_pass http://$upstream_patient;
        }

        location /api/doctors {
            set $upstream_doctor doctor-service:3003;
            proxy_pass http://$upstream_doctor;
        }

        location /api/appointments {
            set $upstream_appointment appointment-service:3004;
            proxy_pass http://$upstream_appointment;
        }

        location /api/payments {
            set $upstream_payment payment-service:3005;
            proxy_pass http://$upstream_payment;
        }

        location /api/notifications {
            set $upstream_notification notification-service:3006;
            proxy_pass http://$upstream_notification;
        }

        location /api/telemedicine {
            set $upstream_telemedicine telemedicine-service:3007;
            proxy_pass http://$upstream_telemedicine;
        }

        location /api/ai {
            set $upstream_ai ai-symptom-service:3008;
            proxy_pass http://$upstream_ai;
        }

        location /health {
            return 200 '{"status":"ok","service":"api-gateway"}';
            add_header Content-Type application/json;
        }
    }
}
