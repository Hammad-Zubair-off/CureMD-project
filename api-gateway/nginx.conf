events {
    worker_connections 1024;
}

http {

    # Docker's internal DNS resolver
    # This tells nginx to resolve hostnames when a request arrives,
    # not when nginx starts — so missing containers won't crash nginx
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    server {
        listen 80;

        client_max_body_size 10M;

        proxy_http_version 1.1;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         'upgrade';
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header Authorization      $http_authorization;
        proxy_cache_bypass                  $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Routes
        # Each location uses a variable for the upstream address.
        # With a variable + resolver, nginx resolves the hostname
        # at request time — not at startup. Missing services return
        # 502 gracefully instead of crashing the whole gateway.

        location /api/auth {
            set $upstream http://auth-service:3001;
            proxy_pass $upstream;
        }

        location /api/patients {
            set $upstream http://patient-service:3002;
            proxy_pass $upstream;
        }

        location /api/doctors {
            set $upstream http://doctor-service:3003;
            proxy_pass $upstream;
        }

        location /api/appointments {
            set $upstream http://appointment-service:3004;
            proxy_pass $upstream;
        }

        location /api/payments {
            set $upstream http://payment-service:3005;
            proxy_pass $upstream;
        }

        location /api/notifications {
            set $upstream http://notification-service:3006;
            proxy_pass $upstream;
        }

        location /api/telemedicine {
            set $upstream http://telemedicine-service:3007;
            proxy_pass $upstream;
        }

        location /api/ai {
            set $upstream http://ai-symptom-service:3008;
            proxy_pass $upstream;
        }

        location /health {
            return 200 '{"status":"ok","service":"api-gateway"}';
            add_header Content-Type application/json;
        }
    }
}